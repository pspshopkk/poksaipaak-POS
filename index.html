<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - ปอกใส่ปาก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #c0392b;
            --primary-hover: #962d22;
            --bg: #f8f9fa;
            --white: #ffffff;
            --border: #e9ecef;
            --border-dark: #ced4da;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --success: #27ae60;
            --blue: #2980b9;
        }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); }
        .container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }
        @media (max-width: 768px) { .container { flex-direction: column; } }

        .menu-section { flex: 1.8; text-align: left; background: var(--white); padding: 20px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .cart-section { flex: 1.2; display: flex; flex-direction: column; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; text-align: left; background: var(--white); padding: 20px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        h2 { margin: 0 0 15px 0; color: var(--text-main); border-bottom: 2px solid var(--border); padding-bottom: 8px; font-size: 18px; font-weight: 700; }

        /* แถบแจ้งเตือนออเดอร์ใหม่จาก LINE */
        .cloud-orders-box { background: #fffaf0; border: 1px solid #f39c12; border-radius: 6px; padding: 12px; margin-bottom: 15px; }
        .cloud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cloud-title { font-weight: 700; color: #d35400; font-size: 13px; }
        .cloud-refresh-btn { background: #fff; border: 1px solid #f39c12; color: #d35400; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .cloud-order-item { background: #fff; border: 1px solid #fae5d3; border-radius: 4px; padding: 8px 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .cloud-btn-load { background: var(--success); color: #fff; border: none; border-radius: 4px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .custom-item-box { background: #fdfdfd; border: 1px dashed var(--border-dark); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
        .custom-item-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .custom-item-row input { padding: 6px 8px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px; min-width: 0; }
        .btn-add-custom { background: var(--text-main); color: white; border: none; padding: 7px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: 600; font-size: 13px; }

        .customer-box { background: #ffffff; border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 12px; }
        .customer-box select { width: 100%; padding: 8px; border: 1px solid var(--border-dark); border-radius: 4px; font-size: 13px; background: #fff; margin-bottom: 10px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 3px; font-weight: 600; color: var(--text-main); }
        .form-group label span.req { color: var(--primary); }
        .form-group input, .form-group textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
        .btn-save-cust { background: var(--blue); color: white; border: none; padding: 8px; border-radius: 4px; font-size: 12px; font-weight: 600; width: 100%; cursor: pointer; }
        .btn-clear-cust { background: #f8f9fa; color: #555; border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; float: right; }
        .status-badge { font-size: 11px; margin-top: 4px; min-height: 16px; font-weight: 500; }

        .category-title { padding: 6px 10px; border-radius: 4px; margin: 15px 0 8px; font-weight: 700; color: var(--text-main); font-size: 14px; background: #f1f3f5; }
        .cat-dip { background: #f8f9fa; border-left: 3px solid #f39c12; }
        .cat-service { background: #f8f9fa; border-left: 3px solid #8e44ad; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--border); }
        .menu-item.out-of-stock { opacity: 0.5; }
        .menu-item.out-of-stock .item-name { text-decoration: line-through; }
        .item-name { cursor: pointer; flex: 1; font-size: 14px; padding-right: 10px; }
        .btn-add { background: var(--text-main); color: white; width: 65px; border: none; border-radius: 4px; padding: 5px; cursor: pointer; font-size: 12px; }
        .btn-disabled { background: #e9ecef; color: #adb5bd; width: 65px; border: none; border-radius: 4px; padding: 5px; cursor: not-allowed; font-size: 12px; }

        .cart-list { flex: 1; overflow-y: auto; margin-bottom: 15px; min-height: 90px; border: 1px solid var(--border); padding: 10px; border-radius: 4px; background: #fdfdfd; }
        .cart-item { display: flex; flex-direction: column; margin-bottom: 10px; font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .cart-item-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .cart-controls button { width: 26px; height: 26px; cursor: pointer; border: 1px solid var(--border-dark); background: #fff; border-radius: 3px; font-weight: 600; }
        .cart-sauce-row { background: #fff; padding: 6px; border-radius: 4px; border: 1px solid var(--border); margin-top: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
        .cart-sauce-select { padding: 3px; border-radius: 4px; border: 1px solid var(--border-dark); font-size: 11px; width: 100%; }

        .btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn-group button { flex: 1; padding: 6px 0; border: 1px solid var(--border-dark); background: white; color: var(--text-main); border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-group button.active { background: var(--text-main); color: white; border-color: var(--text-main); }

        .totals { border-top: 1px solid var(--border); padding-top: 10px; margin-bottom: 12px; }
        .total-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; }
        .total-row.grand { font-size: 18px; font-weight: 700; color: var(--primary); }
        .btn-print { width: 100%; padding: 11px; background: var(--primary); color: white; font-size: 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-print:hover { background: var(--primary-dark); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 360px; text-align: center; }

        #receipt-container { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; z-index: -1000; }
        #receipt { width: 212px; padding: 10px; font-size: 11px; background: white; color: black; }
        .r-header { text-align: center; border-bottom: 1px dashed black; padding-bottom: 5px; margin-bottom: 5px; }
        .r-title { font-size: 14px; font-weight: bold; margin: 0; }
        .r-info { margin: 2px 0; font-size: 10px; }
        .r-address-print { font-size: 10px; margin: 3px 0; text-align: left; background: #fafafa; padding: 3px; word-break: break-word; }
        .r-note-print { margin: 4px 0; font-size: 11px; font-weight: bold; border: 1px dashed #999; padding: 2px; display: none; }
        .r-table { width: 100%; border-collapse: collapse; margin-bottom: 5px; font-size: 10px; }
        .r-table th { border-bottom: 1px dashed black; text-align: left; padding: 3px 0; }
        .r-table td { padding: 3px 0; vertical-align: top; line-height: 1.3; }
        .r-totals { border-top: 1px dashed black; padding-top: 4px; font-size: 11px; }
        .r-totals .flex { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .r-footer { text-align: center; margin-top: 8px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu-section">
            <h2>ระบบจัดการออเดอร์หน้าร้าน (POS)</h2>
            <div id="menu-container">
                <div style="text-align:center; padding:40px; color:#95a5a6; font-size:13px;">กำลังโหลดฐานข้อมูลจากคลาวด์...</div>
            </div>
        </div>

        <div class="cart-section">
            <h2>รายการสั่งซื้อ</h2>

            <div class="cloud-orders-box" id="cloud-box" style="display:none;">
                <div class="cloud-header">
                    <span class="cloud-title" id="cloud-count-title">ออเดอร์ใหม่จาก LINE</span>
                    <button type="button" class="cloud-refresh-btn" onclick="checkCloudOrders()">รีเฟรช</button>
                </div>
                <div id="cloud-orders-list"></div>
            </div>

            <div class="custom-item-box">
                <label style="display:block; font-size:12px; font-weight:600; color:var(--text-main); margin-bottom:5px;">เพิ่มรายการพิเศษนอกเมนู</label>
                <div class="custom-item-row">
                    <input type="text" id="custom-name" placeholder="ชื่อรายการ เช่น เมล่อน" style="flex: 2;">
                    <input type="number" id="custom-price" placeholder="ราคา" min="0" style="flex: 1;">
                    <input type="number" id="custom-qty" value="1" min="1" style="width: 48px; text-align: center;">
                </div>
                <button type="button" class="btn-add-custom" onclick="addCustomItem()">เพิ่มรายการพิเศษลงบิล</button>
            </div>

            <div class="form-group">
                <label>ช่องทางการสั่งซื้อ</label>
                <div class="btn-group">
                    <button type="button" class="active" onclick="setChannel('LINE', this)">LINE</button>
                    <button type="button" onclick="setChannel('Facebook', this)">Facebook</button>
                    <button type="button" onclick="setChannel('หน้าร้าน', this)">หน้าร้าน</button>
                </div>
            </div>

            <div class="customer-box">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <label style="font-weight:600; font-size:12px;">ข้อมูลลูกค้าและสถานที่จัดส่ง</label>
                    <button type="button" class="btn-clear-cust" onclick="clearCustomerFields()">ล้างข้อมูล</button>
                </div>

                <select id="customer-dropdown" onchange="onSelectCustomerDropdown(this)">
                    <option value="">-- กำลังโหลดรายชื่อลูกค้า... --</option>
                </select>
                
                <div class="form-group">
                    <label>ชื่อลูกค้า <span class="req">*</span></label>
                    <input type="text" id="customer-name" placeholder="ระบุชื่อจริง หรือชื่อเรียก">
                </div>

                <div class="form-group">
                    <label>เบอร์โทรศัพท์ <span class="req">*</span></label>
                    <input type="tel" id="customer-phone" placeholder="เช่น 0812345678">
                </div>

                <div class="form-group">
                    <label>สถานที่จัดส่ง <span class="req">*</span></label>
                    <textarea id="customer-address" rows="2" placeholder="ระบุบ้านเลขที่, ถนน/ซอย หรือพิกัดแผนที่"></textarea>
                </div>

                <button type="button" class="btn-save-cust" onclick="manualSaveCustomer()">บันทึก / อัปเดตข้อมูลลูกค้าลงชีท</button>
                <div id="customer-save-status" class="status-badge"></div>
            </div>
            
            <div class="form-group">
                <label>หมายเหตุพิเศษ</label>
                <input type="text" id="order-note" placeholder="ข้อความเพิ่มเติม">
            </div>

            <div class="cart-list" id="cart-list"></div>

            <div class="form-group">
                <label>ค่าบริการจัดส่ง (บาท)</label>
                <div class="btn-group">
                    <button type="button" class="del-btn active" onclick="setDelivery(0)">ฟรี / รับเอง</button>
                    <button type="button" class="del-btn" onclick="setDelivery(10)">+ 10 บาท</button>
                    <button type="button" class="del-btn" onclick="setDelivery(20)">+ 20 บาท</button>
                    <button type="button" class="del-btn" onclick="setDelivery(30)">+ 30 บาท</button>
                </div>
            </div>

            <div class="totals">
                <div class="total-row"><span>รวมค่าสินค้า:</span><span id="subtotal">0 บาท</span></div>
                <div class="total-row"><span>ค่าจัดส่ง:</span><span id="del-fee">0 บาท</span></div>
                <div class="total-row grand"><span>รวมทั้งหมด:</span><span id="grand-total">0 บาท</span></div>
            </div>

            <button class="btn-print" id="btn-download" onclick="generateReceiptImage()">ออกใบเสร็จ</button>
        </div>
    </div>

    <div class="modal-overlay" id="receipt-modal">
        <div class="modal-content">
            <h3 style="margin:0 0 10px; font-size:16px;">สรุปใบเสร็จรับเงิน</h3>
            <p style="font-size:12px; color:#555; margin-bottom:10px;">แตะค้างที่รูปภาพ หรือกดปุ่มบันทึกด้านล่าง</p>
            <div style="max-height:60vh; overflow-y:auto; margin-bottom:15px; background:#f0f0f0; border-radius:4px; padding:5px;">
                <img id="receipt-result-img" src="" style="width:100%; max-width:212px; display:block; margin:0 auto;">
            </div>
            <div id="dl-btn-container"></div>
            <button style="background:#6c757d; color:white; border:none; padding:9px; border-radius:4px; font-weight:600; width:100%; cursor:pointer;" onclick="closeReceiptModal()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <div id="receipt-container">
        <div id="receipt">
            <div class="r-header">
                <h3 class="r-title">ปอกใส่ปาก</h3>
                <p class="r-info" id="r-time"></p>
                <p class="r-info" id="r-channel"></p>
                <p class="r-info" id="r-customer"></p>
                <p class="r-address-print" id="r-address"></p>
                <p class="r-note-print" id="r-note"></p> 
            </div>
            <table class="r-table">
                <thead>
                    <tr><th>รายการ</th><th style="text-align:center; width:30px;">จำนวน</th><th style="text-align:right; width:45px;">ราคา</th></tr>
                </thead>
                <tbody id="r-items"></tbody>
            </table>
            <div class="r-totals">
                <div class="flex"><span>ค่าสินค้า:</span><span id="r-subtotal"></span></div>
                <div class="flex"><span>ค่าจัดส่ง:</span><span id="r-delfee"></span></div>
                <div class="flex" style="font-weight:bold; font-size:12px;"><span>รวมทั้งหมด:</span><span id="r-grandtotal"></span></div>
            </div>
            <div class="r-footer">ขอบคุณที่อุดหนุนค่ะ</div>
        </div>
    </div>

    <script>
        const MENU_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyaPiqWEQhgM7nxSTDj67DU_8TsWVu36aJNLagaQ33OBRKGErUyiA2x3M9YiMF7kuvL/exec'; 
        const CORE_API_URL = 'https://script.google.com/macros/s/AKfycbw_E7mdky1b9Jle_1YK6-a4SOgbm7nAHYJOtTgS3aNrizeFiOxwywT92BqI8NA7RrEeOA/exec'; 

        let menuData = [], customerList = [], itemDictionary = {};
        let cart = {}, cartSauces = {}, deliveryFee = 0, orderChannel = 'LINE';
        let pendingOrdersList = [];

        const cleanPhone = p => String(p || '').replace(/[^0-9]/g, '');
        const isServiceItem = item => /บริการ|service|addon/i.test(String(item.category || ''));
        const checkFruitSauceEligibility = name => !name.includes('ฝรั่งแช่บ๊วย') && /มะม่วง|สับปะรด|แอปเปิ้ล|ฝรั่ง/.test(name);

        function setChannel(channel, btn) {
            orderChannel = channel;
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function loadData() {
            try {
                const res = await fetch(MENU_SCRIPT_URL + '?action=getData');
                menuData = await res.json();
                menuData.forEach(item => { itemDictionary[item.id] = item; });
                renderMenu();
            } catch (e) {
                document.getElementById('menu-container').innerHTML = '<div style="color:#e74c3c; text-align:center;">โหลดเมนูไม่สำเร็จ กรุณารีเฟรช</div>';
            }
            loadCustomers();
            checkCloudOrders();
            setInterval(checkCloudOrders, 20000);
        }

        async function loadCustomers() {
            try {
                const res = await fetch(CORE_API_URL + '?action=get');
                customerList = await res.json();
                renderCustomerDropdown();
            } catch (e) {
                document.getElementById('customer-dropdown').innerHTML = '<option value="">-- ไม่สามารถโหลดรายชื่อลูกค้าได้ --</option>';
            }
        }

        async function checkCloudOrders() {
            try {
                const res = await fetch(CORE_API_URL + '?action=getPendingOrders');
                const data = await res.json();
                if (Array.isArray(data)) {
                    pendingOrdersList = data.filter(item => item && item.orderId && String(item.orderId).startsWith('ORD-'));
                } else {
                    pendingOrdersList = [];
                }
                renderCloudOrders();
            } catch (e) {}
        }

        function renderCloudOrders() {
            const box = document.getElementById('cloud-box');
            const listEl = document.getElementById('cloud-orders-list');
            const titleEl = document.getElementById('cloud-count-title');

            if (!pendingOrdersList || pendingOrdersList.length === 0) {
                box.style.display = 'none';
                return;
            }

            box.style.display = 'block';
            titleEl.innerText = `มี ${pendingOrdersList.length} ออเดอร์ใหม่จาก LINE`;
            listEl.innerHTML = '';

            pendingOrdersList.forEach((ord, index) => {
                const div = document.createElement('div');
                div.className = 'cloud-order-item';
                div.innerHTML = `
                    <div style="font-size:12px; line-height:1.3;">
                        <b>คุณ ${ord.name || 'ไม่ระบุชื่อ'}</b> (${ord.total || 0} บาท)<br>
                        <small style="color:#7f8c8d;">เวลาสั่ง: ${ord.time || '-'}</small>
                    </div>
                    <button type="button" class="cloud-btn-load" onclick="loadOrderIntoPOS(${index})">ดึงเข้าบิล</button>
                `;
                listEl.appendChild(div);
            });
        }

        async function loadOrderIntoPOS(idx) {
            const ord = pendingOrdersList[idx];
            if (!ord) return;

            document.getElementById('customer-name').value = ord.name || '';
            document.getElementById('customer-phone').value = ord.phone || '';
            document.getElementById('customer-address').value = ord.address || '';
            document.getElementById('order-note').value = ord.note || '';

            cart = {};
            cartSauces = {};

            if (Array.isArray(ord.items)) {
                ord.items.forEach(it => {
                    let matchedId = it.id;
                    if (!itemDictionary[matchedId]) {
                        const found = Object.values(itemDictionary).find(m => m.name === it.name);
                        if (found) matchedId = found.id;
                    }
                    if (matchedId) {
                        cart[matchedId] = it.qty;
                        if (Array.isArray(it.sauces)) cartSauces[matchedId] = it.sauces;
                    }
                });
            }

            renderCart();

            const targetOrderId = ord.orderId;
            pendingOrdersList.splice(idx, 1);
            renderCloudOrders();

            fetch(`${CORE_API_URL}?action=completeOrder&orderId=${encodeURIComponent(targetOrderId)}`, { mode: 'no-cors' });
            alert(`ดึงข้อมูลออเดอร์ของคุณ "${ord.name}" ลงบิลเรียบร้อยแล้ว`);
        }

        function renderCustomerDropdown(selectedIdx = null) {
            const dropdown = document.getElementById('customer-dropdown');
            let html = '<option value="">-- เลือกลูกค้าเดิม (หรือกรอกใหม่ด้านล่าง) --</option>';
            customerList.forEach((c, idx) => {
                const isSel = (selectedIdx !== null && selectedIdx === idx) ? 'selected' : '';
                html += `<option value="${idx}" ${isSel}>${c.name || 'ไม่ระบุชื่อ'} (${c.phone || '-'})</option>`;
            });
            dropdown.innerHTML = html;
        }

        function onSelectCustomerDropdown(el) {
            if (el.value === "") return;
            const c = customerList[el.value];
            if (c) {
                document.getElementById('customer-name').value = c.name || '';
                document.getElementById('customer-phone').value = c.phone || '';
                document.getElementById('customer-address').value = c.address || '';
                showSaveStatus(`ดึงข้อมูล: ${c.name} (${c.phone}) เรียบร้อยแล้ว`, '#2980b9');
            }
        }

        function clearCustomerFields() {
            document.getElementById('customer-dropdown').value = "";
            document.getElementById('customer-name').value = "";
            document.getElementById('customer-phone').value = "";
            document.getElementById('customer-address').value = "";
            showSaveStatus('พร้อมกรอกลูกค้าใหม่', '#7f8c8d');
            document.getElementById('customer-name').focus();
        }

        function showSaveStatus(text, color = '#27ae60') {
            const badge = document.getElementById('customer-save-status');
            badge.innerText = text;
            badge.style.color = color;
        }

        function manualSaveCustomer() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            if (!name) { alert('กรุณากรอกชื่อลูกค้า'); document.getElementById('customer-name').focus(); return; }
            if (!phone) { alert('กรุณากรอกเบอร์โทรศัพท์'); document.getElementById('customer-phone').focus(); return; }
            if (!address) { alert('กรุณากรอกสถานที่จัดส่ง'); document.getElementById('customer-address').focus(); return; }

            showSaveStatus('กำลังบันทึกข้อมูล...', '#7f8c8d');

            const url = `${CORE_API_URL}?action=save&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&address=${encodeURIComponent(address)}`;
            fetch(url).then(r => r.json()).then(() => {
                const cPhone = cleanPhone(phone);
                const idx = customerList.findIndex(c => (cPhone && cleanPhone(c.phone) === cPhone) || (name && c.name.toLowerCase() === name.toLowerCase()));

                if (idx >= 0) {
                    customerList[idx] = { name, phone, address };
                    renderCustomerDropdown(idx);
                    alert(`อัปเดตข้อมูลคุณ "${name}" เรียบร้อยแล้ว`);
                } else {
                    customerList.push({ name, phone, address });
                    renderCustomerDropdown(customerList.length - 1);
                    alert(`บันทึกลูกค้าใหม่คุณ "${name}" สำเร็จแล้ว`);
                }
                showSaveStatus(`บันทึกข้อมูลสำเร็จ`, '#27ae60');
            }).catch(() => {
                alert('ไม่สามารถบันทึกได้ กรุณาลองใหม่อีกครั้ง');
                showSaveStatus('บันทึกไม่สำเร็จ', '#e74c3c');
            });
        }

        function addCustomItem() {
            const nameEl = document.getElementById('custom-name');
            const priceEl = document.getElementById('custom-price');
            const qtyEl = document.getElementById('custom-qty');
            const name = nameEl.value.trim();
            const price = parseFloat(priceEl.value);
            const qty = parseInt(qtyEl.value) || 1;

            if (!name) { alert('กรุณากรอกชื่อรายการพิเศษ'); nameEl.focus(); return; }
            if (isNaN(price) || price < 0) { alert('กรุณากรอกราคาที่ถูกต้อง'); priceEl.focus(); return; }

            const customId = 'custom_' + Date.now();
            itemDictionary[customId] = { id: customId, name, price, available: true, category: 'custom' };
            cart[customId] = qty;

            nameEl.value = ''; priceEl.value = ''; qtyEl.value = '1';
            renderCart();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const standardCats = [...new Set(menuData.map(i => Number(i.category)))].filter(c => !isNaN(c) && c >= 40 && c <= 100).sort((a,b)=>a-b);
            standardCats.forEach(cat => {
                const items = menuData.filter(i => Number(i.category) === cat && !isServiceItem(i));
                if (items.length) createCategoryBlock(`กล่องละ ${cat} บาท`, items);
            });

            const premium = menuData.filter(i => !isNaN(Number(i.category)) && Number(i.category) > 100 && !isServiceItem(i));
            if (premium.length) createCategoryBlock('ผลไม้พรีเมียม', premium);

            const services = menuData.filter(i => isServiceItem(i));
            if (services.length) createCategoryBlock('บริการเสริม / แพ็กเกจของขวัญ', services, 'service');

            const dips = menuData.filter(i => !isNaN(Number(i.category)) && Number(i.category) < 40 && !isServiceItem(i));
            if (dips.length) createCategoryBlock('น้ำจิ้มและพริกเกลือ (สั่งเพิ่ม)', dips, 'dip');
        }

        function createCategoryBlock(title, items, type) {
            const container = document.getElementById('menu-container');
            const catTitle = document.createElement('div');
            catTitle.className = `category-title ${type === 'dip' ? 'cat-dip' : type === 'service' ? 'cat-service' : ''}`;
            catTitle.innerText = title;
            container.appendChild(catTitle);

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = `menu-item ${!item.available ? 'out-of-stock' : ''}`;
                div.innerHTML = `
                    <div class="item-name" ${item.available ? `onclick="addToCart('${item.id}')"` : ''}>
                        ${item.name} <span style="color:var(--primary); font-size:12px;">(${item.price > 0 ? item.price + ' บาท' : 'ฟรี'})</span>
                    </div>
                    ${item.available 
                        ? `<button class="btn-add" onclick="addToCart('${item.id}')">+ เพิ่ม</button>` 
                        : `<button class="btn-disabled" disabled>หมด</button>`}
                `;
                container.appendChild(div);
            });
        }

        function addToCart(id) {
            if (!itemDictionary[id]?.available) return;
            cart[id] = (cart[id] || 0) + 1;
            if (!isServiceItem(itemDictionary[id]) && checkFruitSauceEligibility(itemDictionary[id].name)) {
                if (!cartSauces[id]) cartSauces[id] = [];
                cartSauces[id].push("พริกเกลือนัวร์ (ฟรี)");
            }
            renderCart();
        }

        function updateQty(id, change) {
            if (!cart[id]) return;
            cart[id] += change;
            if (!cartSauces[id]) cartSauces[id] = [];
            if (change > 0) cartSauces[id].push("พริกเกลือนัวร์ (ฟรี)");
            else cartSauces[id].pop();

            if (cart[id] <= 0) { delete cart[id]; delete cartSauces[id]; }
            renderCart();
        }

        function setDelivery(fee) {
            deliveryFee = fee;
            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(fee) || (fee === 0 && btn.innerText.includes('ฟรี')));
            });
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            let subtotal = 0;

            for (const id in cart) {
                const item = itemDictionary[id];
                if (!item) continue;
                const qty = cart[id];
                const totalItem = qty * item.price;
                subtotal += totalItem;

                let sauceHTML = '';
                if (!isServiceItem(item) && checkFruitSauceEligibility(item.name) && qty > 0) {
                    sauceHTML = `<div class="cart-sauce-row">`;
                    for (let i = 0; i < qty; i++) {
                        if (!cartSauces[id]) cartSauces[id] = [];
                        if (!cartSauces[id][i]) cartSauces[id][i] = "พริกเกลือนัวร์ (ฟรี)";
                        const cur = cartSauces[id][i];
                        sauceHTML += `
                            <div>กล่องที่ ${i+1}: 
                                <select class="cart-sauce-select" onchange="cartSauces['${id}'][${i}] = this.value">
                                    <option value="ไม่รับน้ำจิ้ม" ${cur === 'ไม่รับน้ำจิ้ม' ? 'selected' : ''}>ไม่รับน้ำจิ้ม</option>
                                    <option value="พริกเกลือนัวร์ (ฟรี)" ${cur === 'พริกเกลือนัวร์ (ฟรี)' ? 'selected' : ''}>พริกเกลือนัวร์ (ฟรี)</option>
                                    <option value="พริกเกลือกะปิแห้ง (ฟรี)" ${cur === 'พริกเกลือกะปิแห้ง (ฟรี)' ? 'selected' : ''}>พริกเกลือกะปิแห้ง (ฟรี)</option>
                                    <option value="พริกเกลือลาวแซ่บ (ฟรี)" ${cur === 'พริกเกลือลาวแซ่บ (ฟรี)' ? 'selected' : ''}>พริกเกลือลาวแซ่บ (ฟรี)</option>
                                    <option value="น้ำจิ้มบ๊วยเค็ม (ฟรี)" ${cur === 'น้ำจิ้มบ๊วยเค็ม (ฟรี)' ? 'selected' : ''}>น้ำจิ้มบ๊วยเค็ม (ฟรี)</option>
                                    <option value="กะปิปลาร้า (+20 บาท)" ${cur === 'กะปิปลาร้า (+20 บาท)' ? 'selected' : ''}>กะปิปลาร้า (+20 บาท)</option>
                                    <option value="กะปิหวาน (+20 บาท)" ${cur === 'กะปิหวาน (+20 บาท)' ? 'selected' : ''}>กะปิหวาน (+20 บาท)</option>
                                </select>
                            </div>`;
                    }
                    sauceHTML += `</div>`;
                }

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-main">
                        <div style="flex:1;">
                            ${item.name} ${id.startsWith('custom_') ? '<small style="color:var(--blue);">[พิเศษ]</small>' : ''}<br>
                            <small style="color:var(--primary); font-weight:600;">${item.price > 0 ? item.price + ' บาท' : 'ฟรี'}</small>
                        </div>
                        <div class="cart-controls">
                            <button onclick="updateQty('${id}', -1)">-</button>
                            <span style="margin:0 8px; font-weight:600;">${qty}</span>
                            <button onclick="updateQty('${id}', 1)">+</button>
                        </div>
                        <div style="width:50px; text-align:right; font-weight:600;">${totalItem} ฿</div>
                    </div>
                    ${sauceHTML}
                `;
                list.appendChild(div);
            }

            if (!Object.keys(cart).length) {
                list.innerHTML = '<div style="color:#adb5bd; text-align:center; padding-top:35px; font-size:13px;">ยังไม่มีรายการสั่งซื้อ</div>';
            }

            document.getElementById('subtotal').innerText = subtotal + ' บาท';
            document.getElementById('del-fee').innerText = deliveryFee + ' บาท';
            document.getElementById('grand-total').innerText = (subtotal + deliveryFee) + ' บาท';
        }

        function generateReceiptImage() {
            if (!Object.keys(cart).length) { alert('กรุณาเพิ่มสินค้าลงตะกร้าก่อนสร้างใบเสร็จ'); return; }

            const btn = document.getElementById('btn-download');
            btn.innerText = 'กำลังออกใบเสร็จ...'; btn.disabled = true;

            const now = new Date();
            const timeStr = `${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH').substring(0,5)} น.`;
            const fileName = `Receipt_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.png`;

            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const addr = document.getElementById('customer-address').value.trim();
            const note = document.getElementById('order-note').value.trim();

            document.getElementById('r-time').innerText = 'เวลารับออเดอร์ : ' + timeStr;
            document.getElementById('r-channel').innerText = 'ช่องทาง : ' + orderChannel;
            document.getElementById('r-customer').innerText = 'ลูกค้า : ' + ((name + (phone ? ` (${phone})` : '')).trim() || 'ลูกค้าทั่วไป');

            const rAddr = document.getElementById('r-address');
            if (addr) { rAddr.innerText = 'ที่อยู่ส่ง : ' + addr; rAddr.style.display = 'block'; }
            else { rAddr.style.display = 'none'; }

            const rNote = document.getElementById('r-note');
            if (note) { rNote.innerText = 'หมายเหตุ: ' + note; rNote.style.display = 'block'; }
            else { rNote.style.display = 'none'; }

            const rItems = document.getElementById('r-items');
            rItems.innerHTML = '';
            let subtotal = 0;

            for (const id in cart) {
                const item = itemDictionary[id];
                if (!item) continue;
                const qty = cart[id];
                const total = qty * item.price;
                subtotal += total;

                const validSauces = (cartSauces[id] || []).filter(s => s && !s.includes('ไม่รับ'));
                const sauceLine = validSauces.length ? `<br><small style="color:#666;">(${validSauces.join(', ')})</small>` : '';

                rItems.innerHTML += `<tr><td style="padding-right:5px;">${item.name}${sauceLine}</td><td style="text-align:center;">x${qty}</td><td style="text-align:right;">${total}</td></tr>`;
            }

            document.getElementById('r-subtotal').innerText = subtotal + ' บาท';
            document.getElementById('r-delfee').innerText = deliveryFee + ' บาท';
            document.getElementById('r-grandtotal').innerText = (subtotal + deliveryFee) + ' บาท';

            setTimeout(() => {
                html2canvas(document.getElementById('receipt'), { scale: 2, backgroundColor: '#ffffff', logging: false }).then(canvas => {
                    const imgData = canvas.toDataURL("image/png");
                    document.getElementById('receipt-result-img').src = imgData;
                    document.getElementById('dl-btn-container').innerHTML = `<a href="${imgData}" download="${fileName}" style="background:#27ae60; color:white; padding:10px; border-radius:4px; display:block; text-decoration:none; font-weight:600; margin-bottom:10px;">บันทึกใบเสร็จ</a>`;
                    document.getElementById('receipt-modal').style.display = 'flex';
                }).catch(() => {
                    alert("ไม่สามารถสร้างรูปภาพได้ กรุณาลองใหม่อีกครั้ง");
                }).finally(() => {
                    btn.innerText = 'ออกใบเสร็จ'; btn.disabled = false;
                });
            }, 250);
        }

        function closeReceiptModal() {
            document.getElementById('receipt-modal').style.display = 'none';
        }

        loadData();
    </script>
</body>
</html>
