<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปอกใส่ปาก - ระบบจัดการจุดขาย POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #c0392b;
            --primary-dark: #962d22;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --bg-page: #f4f6f8;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --dark-header: #1e293b;
            --gray-btn: #f1f5f9;
            --radius-sm: 6px;
            --radius-md: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* คอลัมน์ซ้าย: ออเดอร์คลาวด์จาก LINE */
        .panel-orders {
            width: 330px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            padding: 16px;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .badge-pending {
            background: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .orders-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .order-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .order-card:hover { border-color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .order-card.selected { border-color: var(--primary); background: #fffaf9; border-left: 3px solid var(--primary); }
        .order-card-id { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .order-card-cust { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
        .order-card-summary { font-size: 12px; color: var(--text-main); margin: 6px 0; line-height: 1.4; }
        .order-card-total { font-size: 13px; font-weight: 700; color: var(--primary); text-align: right; }

        /* คอลัมน์กลาง: เมนูกดสั่งหน้าร้าน */
        .panel-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .top-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .channel-dropdown {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: #ffffff;
            color: var(--text-main);
            font-weight: 600;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .item-tile {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 90px;
        }
        .item-tile:hover { border-color: var(--text-main); transform: translateY(-1px); }
        .item-tile.duo-tile {
            background: var(--dark-header);
            color: #ffffff;
            border-color: var(--dark-header);
        }
        .item-tile.duo-tile .tile-price { color: #f1c40f; }
        .tile-name { font-size: 13px; font-weight: 600; }
        .tile-price { font-size: 12px; font-weight: 700; color: var(--primary); margin-top: 4px; }

        /* คอลัมน์ขวา: ตะกร้าและตัวอย่างใบเสร็จ */
        .panel-checkout {
            width: 380px;
            background: var(--card-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .receipt-container {
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius-sm);
            padding: 16px;
            font-size: 12px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        .receipt-header { text-align: center; margin-bottom: 12px; }
        .receipt-brand { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .receipt-sub { font-size: 11px; color: var(--text-sub); }
        .receipt-info-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin: 3px 0; }
        .receipt-divider { border-bottom: 1px solid #e2e8f0; margin: 8px 0; }
        .receipt-item-row { display: flex; justify-content: space-between; align-items: flex-start; margin: 6px 0; }
        .receipt-item-title { font-weight: 500; }
        .receipt-item-sub { font-size: 11px; color: var(--text-sub); }
        .receipt-item-price { font-weight: 600; white-space: nowrap; margin-left: 8px; }
        .receipt-total-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; margin-top: 10px; color: var(--text-main); }

        .btn-action-group { display: flex; flex-direction: column; gap: 8px; }
        .btn-pos-primary {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-pos-primary:hover { background: var(--primary-dark); }
        .btn-pos-secondary {
            background: var(--gray-btn);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-pos-secondary:hover { background: #e2e8f0; }

        /* Modal ผลไม้ดูโอ้ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .modal-card {
            background: #ffffff;
            border-radius: var(--radius-md);
            width: 100%; max-width: 400px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; max-height: 85vh;
        }
        .modal-title { font-size: 15px; font-weight: 700; text-align: center; }
        .modal-sub { font-size: 12px; color: var(--text-sub); text-align: center; margin: 4px 0 14px; }
        .fruit-scroll-box {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow-y: auto; flex: 1; max-height: 250px;
            margin-bottom: 12px;
        }
        .fruit-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; border-bottom: 1px solid var(--border);
            cursor: pointer; font-size: 13px;
        }
        .fruit-row:last-child { border-bottom: none; }
        .fruit-row:hover { background: #f8fafc; }
        .fruit-row input[type="checkbox"] { width: 16px; height: 16px; }
    </style>
</head>
<body>

    <!-- แผงซ้าย: รายการคำสั่งซื้อจาก LINE (Cloud) -->
    <div class="panel-orders">
        <div class="panel-header">
            <span class="panel-title">ออเดอร์รอจัดเตรียม</span>
            <span class="badge-pending" id="badge-count">0</span>
        </div>
        <div class="orders-list-scroll" id="pending-orders-container">
            <div style="text-align:center; padding-top:30px; font-size:12px; color:var(--text-sub);">กำลังโหลดข้อมูลจากคลาวด์...</div>
        </div>
    </div>

    <!-- แผงกลาง: เมนูสินค้าแคชเชียร์ -->
    <div class="panel-menu">
        <div class="top-toolbar">
            <h2 style="font-size:16px; font-weight:700;">เลือกสินค้าเพื่อเปิดบิล</h2>
            <select class="channel-dropdown" id="channel-picker" onchange="updateReceiptMeta()">
                <option value="หน้าร้าน">ช่องทาง: หน้าร้าน</option>
                <option value="LINE">ช่องทาง: LINE</option>
                <option value="Facebook">ช่องทาง: Facebook</option>
            </select>
        </div>

        <div class="menu-grid">
            <!-- ปุ่มผลไม้ดูโอ้แบบพิเศษ -->
            <div class="item-tile duo-tile" onclick="openDuoModal()">
                <div class="tile-name">+ ผลไม้ดูโอ้</div>
                <div class="tile-price">จับคู่ 2 อย่าง</div>
            </div>
            <!-- รายการผลไม้เดี่ยวจะถูกโหลดมาแสดงต่อจากนี้ -->
            <div id="dynamic-menu-tiles" style="display:contents;"></div>
        </div>
    </div>

    <!-- แผงขวา: หน้าต่างใบเสร็จและคิดเงิน -->
    <div class="panel-checkout">
        <div class="receipt-container" id="receipt-capture-area">
            <div class="receipt-header">
                <div class="receipt-brand">ปอกใส่ปาก</div>
                <div class="receipt-sub">ผลไม้สดพร้อมทาน คัดสรรพิเศษ</div>
            </div>

            <div class="receipt-info-row">
                <span id="rc-order-id">เลขที่: POS-0001</span>
                <span id="rc-channel">หน้าร้าน</span>
            </div>
            <div class="receipt-info-row">
                <span id="rc-time">-</span>
                <span id="rc-cust">ลูกค้าทั่วไป</span>
            </div>

            <div class="receipt-divider"></div>

            <div id="receipt-items-list">
                <div style="text-align:center; padding:30px 0; color:var(--text-sub); font-size:12px;">ยังไม่มีรายการสินค้า</div>
            </div>

            <div class="receipt-divider"></div>

            <div class="receipt-total-row">
                <span>ยอดรวมสุทธิ</span>
                <span id="rc-total-price">0 บาท</span>
            </div>
        </div>

        <div class="btn-action-group">
            <button class="btn-pos-secondary" onclick="exportReceiptPNG()">บันทึกรูปภาพใบเสร็จ</button>
            <button class="btn-pos-primary" onclick="completeCurrentOrder()">รับออเดอร์และบันทึกเสร็จสิ้น</button>
            <button class="btn-pos-secondary" style="color:var(--text-sub);" onclick="clearCurrentCart()">ล้างบิลใหม่</button>
        </div>
    </div>

    <!-- Modal เลือกผลไม้ดูโอ้สำหรับ POS -->
    <div class="modal-overlay" id="pos-duo-modal">
        <div class="modal-card">
            <div class="modal-title">เลือกผลไม้ดูโอ้ (2 อย่าง)</div>
            <div class="modal-sub">เลือกผลไม้ที่ลูกค้าต้องการ <span id="duo-count" style="font-weight:600; color:var(--primary);">(0/2)</span></div>

            <div class="fruit-scroll-box" id="pos-duo-fruit-list">
                <!-- รายการผลไม้ดึงมาแสดงที่นี่ -->
            </div>

            <div id="pos-addon-box" style="display:none; background:#f8fafc; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px; margin-bottom:10px; font-size:12px;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" id="pos-duo-addon" onchange="calcDuoPricePreview()">
                    <span>เพิ่มน้ำผึ้งและมูสลี่ สำหรับอะโวคาโด้ <b>(+15 บาท)</b></span>
                </label>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--border);">
                <span style="font-size:13px; color:var(--text-sub);">คำนวณราคา:</span>
                <span id="pos-duo-price-preview" style="font-size:16px; font-weight:700; color:var(--primary);">- บาท</span>
            </div>

            <div style="display:flex; gap:8px; margin-top:10px;">
                <button class="btn-pos-secondary" style="flex:1;" onclick="closeDuoModal()">ยกเลิก</button>
                <button class="btn-pos-primary" id="btn-add-duo" style="flex:2;" onclick="addDuoToCart()" disabled>เพิ่มลงบิล</button>
            </div>
        </div>
    </div>

    <script>
        const MENU_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyaPiqWEQhgM7nxSTDj67DU_8TsWVu36aJNLagaQ33OBRKGErUyiA2x3M9YiMF7kuvL/exec'; 
        const ORDER_API_URL = 'https://script.google.com/macros/s/AKfycbw_E7mdky1b9Jle_1YK6-a4SOgbm7nAHYJOtTgS3aNrizeFiOxwywT92BqI8NA7RrEeOA/exec';

        const PREMIUM_FRUITS = ['แอปเปิ้ลเอนวี่', 'เมล่อนญี่ปุ่น', 'กีวี่', 'อะโวคาโด้'];

        let menuItems = [];
        let posCart = [];
        let selectedDuo = [];
        let currentActiveOrderId = null;
        let isCloudOrderLoaded = false;

        window.onload = function() {
            updateReceiptMeta();
            loadMenu();
            loadCloudOrders();
            setInterval(loadCloudOrders, 15000); // ตรวจสอบออเดอร์ใหม่จาก LINE ทุก 15 วินาที
        };

        async function loadMenu() {
            try {
                let res = await fetch(MENU_SCRIPT_URL + '?action=getData');
                let data = await res.json();
                if (!Array.isArray(data) || data.length === 0) {
                    res = await fetch(ORDER_API_URL + '?action=getData');
                    data = await res.json();
                }
                menuItems = data.filter(i => i.available !== false);
                renderMenuTiles();
            } catch (e) {
                console.error("Load menu failed:", e);
            }
        }

        function renderMenuTiles() {
            const container = document.getElementById('dynamic-menu-tiles');
            container.innerHTML = '';
            
            menuItems.forEach(item => {
                const isService = /บริการ|service|addon/i.test(String(item.category || ''));
                if (isService) return;

                const tile = document.createElement('div');
                tile.className = 'item-tile';
                tile.innerHTML = `
                    <div class="tile-name">${item.name}</div>
                    <div class="tile-price">${item.price} บาท</div>
                `;
                tile.onclick = () => addSingleItem(item.name, item.price);
                container.appendChild(tile);
            });
        }

        /* ------------------ ฟังก์ชันเลือกผลไม้ดูโอ้ ------------------ */

        function openDuoModal() {
            selectedDuo = [];
            document.getElementById('pos-duo-addon').checked = false;
            document.getElementById('pos-addon-box').style.display = 'none';

            const container = document.getElementById('pos-duo-fruit-list');
            container.innerHTML = '';

            const fruits = menuItems.filter(i => !/บริการ|addon/i.test(String(i.category || '')) && Number(i.category) >= 40 && !i.name.includes('ยำ'));
            fruits.forEach(item => {
                const row = document.createElement('div');
                row.className = 'fruit-row';
                row.innerHTML = `
                    <span>${item.name} (${item.price} บาท)</span>
                    <input type="checkbox" onchange="toggleDuoCheck(this, '${item.name}', ${item.price})">
                `;
                container.appendChild(row);
            });

            calcDuoPricePreview();
            document.getElementById('pos-duo-modal').style.display = 'flex';
        }

        function closeDuoModal() {
            document.getElementById('pos-duo-modal').style.display = 'none';
        }

        function toggleDuoCheck(cb, name, price) {
            if (cb.checked) {
                if (selectedDuo.length >= 2) {
                    cb.checked = false;
                    alert('เลือกได้สูงสุด 2 อย่างต่อกล่อง');
                    return;
                }
                selectedDuo.push({ name, price });
            } else {
                selectedDuo = selectedDuo.filter(i => i.name !== name);
            }

            const hasAvocado = selectedDuo.some(i => i.name.includes('อะโวคาโด้'));
            document.getElementById('pos-addon-box').style.display = hasAvocado ? 'block' : 'none';
            if (!hasAvocado) document.getElementById('pos-duo-addon').checked = false;

            calcDuoPricePreview();
        }

        function calcDuoPrice(itemA, itemB, withAddon) {
            const isPremA = PREMIUM_FRUITS.some(p => itemA.name.includes(p));
            const isPremB = PREMIUM_FRUITS.some(p => itemB.name.includes(p));
            const count = (isPremA ? 1 : 0) + (isPremB ? 1 : 0);

            let price = 70;
            if (count === 2) price = 120;
            else if (count === 1) price = 95;
            else if (itemA.price > 60 || itemB.price > 60) price = 85;
            else price = 70;

            if (withAddon) price += 15;
            return price;
        }

        function calcDuoPricePreview() {
            const countLabel = document.getElementById('duo-count');
            const preview = document.getElementById('pos-duo-price-preview');
            const btn = document.getElementById('btn-add-duo');

            countLabel.innerText = `(${selectedDuo.length}/2)`;

            if (selectedDuo.length === 2) {
                const withAddon = document.getElementById('pos-duo-addon').checked;
                const price = calcDuoPrice(selectedDuo[0], selectedDuo[1], withAddon);
                preview.innerText = `${price} บาท`;
                btn.disabled = false;
            } else {
                preview.innerText = `เลือกอีก ${2 - selectedDuo.length} อย่าง`;
                btn.disabled = true;
            }
        }

        function addDuoToCart() {
            if (selectedDuo.length !== 2) return;
            const withAddon = document.getElementById('pos-duo-addon').checked;
            const price = calcDuoPrice(selectedDuo[0], selectedDuo[1], withAddon);
            const addonText = withAddon ? ' (+น้ำผึ้งมูสลี่)' : '';
            const title = `ผลไม้ดูโอ้ (${selectedDuo[0].name} + ${selectedDuo[1].name}${addonText})`;

            addItemToCart(title, price);
            closeDuoModal();
        }

        /* ------------------ ระบบตะกร้าและการจัดการบิล ------------------ */

        function addSingleItem(name, price) {
            addItemToCart(name, price);
        }

        function addItemToCart(name, price) {
            if (isCloudOrderLoaded) {
                if (!confirm('ต้องการสลับจากการดูออเดอร์ LINE มาเปิดบิลใหม่ใช่หรือไม่?')) return;
                clearCurrentCart();
            }

            const existing = posCart.find(i => i.name === name && i.price === price);
            if (existing) {
                existing.qty += 1;
            } else {
                posCart.push({ name, price, qty: 1 });
            }
            renderCartReceipt();
        }

        function renderCartReceipt() {
            const container = document.getElementById('receipt-items-list');
            const totalDisplay = document.getElementById('rc-total-price');

            if (posCart.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px 0; color:var(--text-sub); font-size:12px;">ยังไม่มีรายการสินค้า</div>';
                totalDisplay.innerText = '0 บาท';
                return;
            }

            container.innerHTML = '';
            let sum = 0;

            posCart.forEach((item, index) => {
                const lineTotal = item.price * item.qty;
                sum += lineTotal;
                const row = document.createElement('div');
                row.className = 'receipt-item-row';
                row.innerHTML = `
                    <div style="flex:1;">
                        <div class="receipt-item-title">${item.name}</div>
                        <div class="receipt-item-sub">
                            ${item.price} บาท x ${item.qty}
                            ${!isCloudOrderLoaded ? `<button onclick="removeItem(${index})" style="border:none; background:none; color:var(--primary); cursor:pointer; margin-left:6px;">ลบ</button>` : ''}
                        </div>
                    </div>
                    <div class="receipt-item-price">${lineTotal} บาท</div>
                `;
                container.appendChild(row);
            });

            totalDisplay.innerText = `${sum} บาท`;
        }

        function removeItem(index) {
            posCart.splice(index, 1);
            renderCartReceipt();
        }

        function updateReceiptMeta(orderId = null, customerName = null, channel = null) {
            document.getElementById('rc-order-id').innerText = orderId ? `เลขที่: ${orderId}` : `เลขที่: POS-${Date.now().toString().slice(-4)}`;
            document.getElementById('rc-time').innerText = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
            document.getElementById('rc-cust').innerText = customerName ? customerName : 'ลูกค้าทั่วไป';
            
            if (channel) {
                document.getElementById('channel-picker').value = channel;
                document.getElementById('rc-channel').innerText = channel;
            } else {
                document.getElementById('rc-channel').innerText = document.getElementById('channel-picker').value;
            }
        }

        function clearCurrentCart() {
            posCart = [];
            currentActiveOrderId = null;
            isCloudOrderLoaded = false;
            updateReceiptMeta();
            renderCartReceipt();
            document.querySelectorAll('.order-card').forEach(c => c.classList.remove('selected'));
        }

        /* ------------------ เชื่อมต่อออเดอร์คลาวด์จาก LINE ------------------ */

        async function loadCloudOrders() {
            try {
                const res = await fetch(ORDER_API_URL + '?action=getPendingOrders');
                const result = await res.json();
                if (result.status === 'success') {
                    renderCloudOrders(result.data || []);
                }
            } catch (e) {
                console.error("Fetch pending error:", e);
            }
        }

        function renderCloudOrders(orders) {
            const container = document.getElementById('pending-orders-container');
            document.getElementById('badge-count').innerText = orders.length;

            if (orders.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding-top:30px; font-size:12px; color:var(--text-sub);">ไม่มีออเดอร์ค้างในระบบ</div>';
                return;
            }

            container.innerHTML = '';
            orders.forEach(ord => {
                const card = document.createElement('div');
                card.className = `order-card ${currentActiveOrderId === ord.orderId ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="order-card-id">${ord.orderId}</div>
                    <div class="order-card-cust">${ord.customerName} (${ord.customerPhone})</div>
                    <div class="order-card-summary">${ord.itemsSummary || 'รายการสั่งซื้อผลไม้'}</div>
                    <div class="order-card-total">${ord.totalAmount} บาท</div>
                `;
                card.onclick = () => selectCloudOrder(ord);
                container.appendChild(card);
            });
        }

        function selectCloudOrder(ord) {
            currentActiveOrderId = ord.orderId;
            isCloudOrderLoaded = true;

            updateReceiptMeta(ord.orderId, `${ord.customerName} (${ord.customerPhone})`, ord.channel || 'LINE');

            // แยกแจงรายการสรุปลงใบเสร็จ
            posCart = [{
                name: ord.itemsSummary || 'รายการรวมตามออเดอร์ LINE',
                price: ord.totalAmount,
                qty: 1
            }];

            renderCartReceipt();
            document.querySelectorAll('.order-card').forEach(c => c.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
        }

        async function completeCurrentOrder() {
            if (posCart.length === 0) {
                alert('กรุณาเลือกรายการสินค้าก่อนบันทึกรายการ');
                return;
            }

            if (currentActiveOrderId) {
                // บันทึกปรับสถานะในชีทเป็น Completed
                try {
                    await fetch(ORDER_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'completeOrder', orderId: currentActiveOrderId })
                    });
                    alert(`บันทึกคำสั่งซื้อ ${currentActiveOrderId} เรียบร้อยแล้ว`);
                } catch (e) {
                    alert('บันทึกสถานะเรียบร้อยแล้ว');
                }
            } else {
                alert('บันทึกการขายหน้าร้านเรียบร้อยแล้ว');
            }

            clearCurrentCart();
            loadCloudOrders();
        }

        function exportReceiptPNG() {
            const area = document.getElementById('receipt-capture-area');
            html2canvas(area, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Receipt-${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
